<div class="min-h-screen bg-slate-50 text-slate-800">
  <app-sidebar
    [isOpen]="isMenuOpen()"
    (close)="closeMenu()"
  />

  <div class="min-h-screen transition-[padding] duration-300 lg:pl-64">
    <header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white/95 px-4 backdrop-blur sm:px-8">
      <div class="flex min-w-0 items-center gap-3">
        <button
          type="button"
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-slate-200 text-xl text-slate-700 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 lg:hidden"
          aria-label="Abrir menu de navegação"
          [attr.aria-expanded]="isMenuOpen()"
          (click)="toggleMenu()"
        >
          ☰
        </button>

        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-slate-800">
            Startup Platform
          </p>
          <p class="hidden text-xs text-slate-500 sm:block">
            Área de gerenciamento
          </p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-blue-100 text-sm font-bold text-blue-700">
          {{ userInitials() }}
        </div>

        <div class="hidden max-w-52 sm:block">
          <p class="truncate text-sm font-semibold text-slate-800">
            {{ currentUser()?.name ?? 'Visitante' }}
          </p>
          <p class="truncate text-xs text-slate-500">
            {{ userRoleLabel() }}
          </p>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
