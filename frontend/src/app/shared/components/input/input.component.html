
<div class="w-full">
  @if (label()) {
    <label
      [for]="id()"
      class="mb-1.5 block text-sm font-medium text-slate-700"
    >
      {{ label() }}

      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }

  <input
    [id]="id()"
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [attr.maxlength]="maxlength()"
    [required]="required()"
    [disabled]="disabled()"
    [attr.aria-invalid]="!!errorMessage()"
    [attr.aria-describedby]="
      errorMessage() ? id() + '-error' :
      hint() ? id() + '-hint' : null
    "
    class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 disabled:cursor-not-allowed disabled:bg-slate-100"
    [class.border-red-500]="!!errorMessage()"
    (input)="handleInput($any($event.target).value)"
    (blur)="handleBlur()"
  />

  @if (errorMessage()) {
    <p [id]="id() + '-error'" class="mt-1 text-xs text-red-600">
      {{ errorMessage() }}
    </p>
  } @else if (hint()) {
    <p [id]="id() + '-hint'" class="mt-1 text-xs text-slate-500">
      {{ hint() }}
    </p>
  }
</div>
