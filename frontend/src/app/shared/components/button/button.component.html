
<button
  [attr.type]="type()"
  [disabled]="disabled() || loading()"
  [class]="buttonClasses"
  (click)="clicked.emit($event)"
>
  @if (loading()) {
    <span
      aria-hidden="true"
      class="h-4 w-4 animate-spin rounded-full border-2 border-current border-r-transparent"
    ></span>
  }

  <ng-content />
</button>
